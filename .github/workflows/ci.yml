name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow starts this trigger on the Release PR branch.
  # GITHUB_TOKEN pull requests do not start CI by themselves.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22.13', '22', '24']
        exclude:
          - os: windows-latest
            node-version: '22'
    defaults:
      run:
        shell: bash
    steps:
      # Keep line endings as in the repository. Generated docs are compared byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run knip
      - run: npm run typecheck
      - run: npm run check:dashes
      # The coverage gate runs on Linux and macOS. Windows skips mode-bit tests, so it runs the plain suite.
      - run: npm run test:ci
        if: ${{ matrix.os != 'windows-latest' }}
      - run: npm test
        if: ${{ matrix.os == 'windows-latest' }}

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  pack-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Keep line endings as in the repository.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node 22.12.0 is the old Node of the guard checks. Its path goes to GOURNAL_OLD_NODE.
      # The setup-node step below comes second, so Node 22.13 wins on PATH.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.12.0'
      - run: echo "GOURNAL_OLD_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - name: Pack, install, and run the packaged CLI
        run: sh scripts/pack-smoke.sh
      - name: Launcher e2e
        run: sh scripts/launcher-smoke.sh
