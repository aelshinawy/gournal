name: Site

on:
  pull_request:
    paths: &paths
      - 'site/**'
      - 'src/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
      - 'jest.config.mjs'
      - 'jest.site.config.mjs'
      - 'test/site-*.test.ts'
      - 'test/docs-*.test.ts'
      - 'test/helpers/**'
      - 'test/help-text-drift.test.ts'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm run docs:gen
      - name: Check generated pages are current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changed or untracked files:"
            git status --porcelain
            echo "::error::Generated reference pages are out of date. Run npm run docs:gen and commit the result."
            exit 1
          fi
      - run: npm --prefix site ci
      - run: npm --prefix site run build
      - name: Run site tests
        run: npm run test:site
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
