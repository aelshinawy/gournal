name: Release

# This workflow has two triggers.
# 1. A push to main. The release-please job opens or updates the Release PR.
#    When someone merges the Release PR, the same job creates the tag and the GitHub release.
# 2. A push of a tag that starts with v. This is the manual path.
#    Use it for the first release (0.9.0) and for emergencies.
# The stage job stages the package on npm in both cases.
# The stage job must stay in this file. The npm trusted publisher names release.yml.
# Tags and releases that GITHUB_TOKEN creates do not start other workflows.
on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # This job runs only on a branch push to main. It does not run on a tag push.
  # The group name is different from the stage job, so a new push to main
  # never replaces a queued tag run of the stage job.
  release-please:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN pull requests do not start CI. GITHUB_TOKEN may start a workflow_dispatch run.
      # This step starts ci.yml and site.yml on the Release PR branch, so the required checks report on the PR.
      - name: Run CI on the Release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          printf '%s' "$PRS" | jq -r '.[].headBranchName' | while read -r branch; do
            gh workflow run ci.yml --ref "$branch"
            gh workflow run site.yml --ref "$branch"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ steps.release.outputs.prs }}

  # This job runs on a v* tag push, or when release-please creates a release.
  # On a tag push the release-please job is skipped. A skipped needed job skips this job
  # unless the condition starts with always(). The condition below handles both cases.
  stage:
    needs: release-please
    if: >-
      ${{ always() && (
        startsWith(github.ref, 'refs/tags/v') ||
        (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      # TAG is the release-please tag, or the pushed tag on the manual path.
      TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Expected v$version."
            exit 1
          fi
      - name: Choose the npm tag and the release type
        id: channel
        run: |
          version="$(node -p "require('./package.json').version")"
          core="${version%%+*}"
          case "$core" in
            *-*)
              echo "npm_tag=next" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - run: npm test
      - name: Pack, install, and run the packaged CLI
        run: sh scripts/pack-smoke.sh
      # This step packs the dist/ folder that scripts/pack-smoke.sh just built.
      # Keep the pack-smoke step before it.
      - name: Pack the release tarball
        run: |
          mkdir "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"
      # Staged publishing needs npm 11.15.0 or later. Pin one exact version so the release does not drift.
      - name: Install a pinned npm
        run: |
          npm install -g npm@12.2.0
          npm --version
      # This step stages the package. It does not publish it. The package stays private until
      # a maintainer approves it with 2FA on npmjs.com (Staged Packages) or with npm stage approve.
      # No token. npm signs in with the OIDC identity of this workflow (id-token: write).
      # The trusted publisher on npmjs.com must name this file (release.yml) and allow only staging.
      - name: Stage the tarball on npm
        run: npm stage publish "$RUNNER_TEMP"/release/*.tgz --tag "$NPM_TAG" --provenance --access public
        env:
          NPM_TAG: ${{ steps.channel.outputs.npm_tag }}
      - name: Tell the maintainer to approve
        run: |
          {
            echo "## Approve the npm release"
            echo
            echo "The package is staged and is not public yet."
            echo "Open https://www.npmjs.com/package/gournal and approve it in the Staged Packages tab,"
            echo "or run: npm stage list gournal, then npm stage approve <stage-id>."
            echo "Approval asks for 2FA."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub release
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            set -- --prerelease
          else
            set --
          fi
          # release-please creates the GitHub release before this job runs. Then upload the tarball.
          # On the manual tag path no release exists yet. Then create it.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/release/*.tgz --clobber
          else
            gh release create "$TAG" --generate-notes --verify-tag "$@" "$RUNNER_TEMP"/release/*.tgz
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
