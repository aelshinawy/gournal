name: Release

# This workflow runs only when someone pushes a tag that starts with v.
# It does not run on pull requests or on branch pushes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Expected v$version."
            exit 1
          fi
      - name: Choose the npm tag and the release type
        id: channel
        run: |
          version="$(node -p "require('./package.json').version")"
          core="${version%%+*}"
          case "$core" in
            *-*)
              echo "npm_tag=next" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - run: npm test
      - name: Pack, install, and run the packaged CLI
        run: sh scripts/pack-smoke.sh
      # This step packs the dist/ folder that scripts/pack-smoke.sh just built.
      # Keep the pack-smoke step before it.
      - name: Pack the release tarball
        run: |
          mkdir "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"
      # Trusted publishing needs npm 11.5.1 or later. Fail early with a clear message.
      - name: Check the npm version
        run: |
          v="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $v is older than 11.5.1. Trusted publishing needs 11.5.1 or later."
            exit 1
          fi
      # No token. npm signs in with the OIDC identity of this workflow (id-token: write).
      # The trusted publisher on npmjs.com must name this file: release.yml.
      - name: Publish the tarball to npm
        run: npm publish "$RUNNER_TEMP"/release/*.tgz --tag "$NPM_TAG" --provenance --access public
        env:
          NPM_TAG: ${{ steps.channel.outputs.npm_tag }}
      - name: Create the GitHub release
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            set -- --prerelease
          else
            set --
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag "$@" "$RUNNER_TEMP"/release/*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
