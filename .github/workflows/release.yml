name: Release

# This workflow runs only when someone pushes a tag that starts with v.
# It does not run on pull requests or on branch pushes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Expected v$version."
            exit 1
          fi
      - name: Choose the npm tag and the release type
        id: channel
        run: |
          version="$(node -p "require('./package.json').version")"
          core="${version%%+*}"
          case "$core" in
            *-*)
              echo "npm_tag=next" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - run: npm test
      - name: Pack, install, and run the packaged CLI
        run: sh scripts/pack-smoke.sh
      # This step packs the dist/ folder that scripts/pack-smoke.sh just built.
      # Keep the pack-smoke step before it.
      - name: Pack the release tarball
        run: |
          mkdir "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"
      # Staged publishing needs npm 11.15.0 or later. Pin one exact version so the release does not drift.
      - name: Install a pinned npm
        run: |
          npm install -g npm@12.2.0
          npm --version
      # This step stages the package. It does not publish it. The package stays private until
      # a maintainer approves it with 2FA on npmjs.com (Staged Packages) or with npm stage approve.
      # No token. npm signs in with the OIDC identity of this workflow (id-token: write).
      # The trusted publisher on npmjs.com must name this file (release.yml) and allow only staging.
      - name: Stage the tarball on npm
        run: npm stage publish "$RUNNER_TEMP"/release/*.tgz --tag "$NPM_TAG" --provenance --access public
        env:
          NPM_TAG: ${{ steps.channel.outputs.npm_tag }}
      - name: Tell the maintainer to approve
        run: |
          {
            echo "## Approve the npm release"
            echo
            echo "The package is staged and is not public yet."
            echo "Open https://www.npmjs.com/package/gournal and approve it in the Staged Packages tab,"
            echo "or run: npm stage list gournal, then npm stage approve <stage-id>."
            echo "Approval asks for 2FA."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub release
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            set -- --prerelease
          else
            set --
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag "$@" "$RUNNER_TEMP"/release/*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
