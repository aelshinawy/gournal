name: PR title

# This check is advisory. Do not add it to the required checks.
# A squash merge uses the pull request title as the commit message.
# release-please reads that message. A wrong title hides a change from the changelog.
# The Release PR is opened by GITHUB_TOKEN, so no workflow runs on it. This check never reports there.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            deps
            docs
            chore
            ci
            test
            build
            refactor
            style
            revert
